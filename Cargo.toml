[workspace]
resolver = "2"
# aerocore and aeroplug live in vendor/aerosuite (git submodule) and are
# referenced via path dependencies in each crate's own Cargo.toml.
# They must NOT be listed as workspace members here because vendor/aerosuite
# has its own [workspace] root; nested workspaces are not supported by Cargo.
members = [
    "ipseccore",
    "ipsecpulse",
    "ipsecscale",
    "ipsecnode",
    "fleetpulse",
    "squid-infoproxy",
]

# ── Pinned shared dependency versions ─────────────────────────────────────────
[workspace.dependencies]
anyhow             = "1"
tokio              = { version = "1", features = ["full"] }
clap               = { version = "4", features = ["derive", "env"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
redis              = { version = "1.6", features = ["tls-rustls", "tokio-rustls-comp", "connection-manager"] }
reqwest            = { version = "0.13", features = ["json"] }
chrono             = "0.4"
# Required by aerocore (path dep from vendor/aerosuite) — versions must
# match aerosuite's [workspace.dependencies] exactly so Cargo unifies them.
serde_urlencoded   = "0.7"
sha2               = "0.11"
hmac               = "0.13"
hex                = "0.4"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-postgres     = "0.7"
axum               = "0.7"
thiserror          = "2"
rsvici             = "0.1"
futures-util       = "0.3"
serde_bytes        = "0.11"
toml               = "0.8"

# ── Release profile ────────────────────────────────────────────────────────────
[profile.release]
opt-level      = 3
lto            = "fat"
codegen-units  = 1
panic          = "abort"
strip          = true
