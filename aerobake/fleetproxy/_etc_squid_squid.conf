# squid.conf -- FleetShell proxy (dual-homed forward proxy on :8080)
#
# Deployed on the baked Alpine AMI (see fleetshell-proxy.pkr.hcl). The instance
# is DUAL-HOMED:
#   eth0  device-facing ENI  (subnet default route -> IPSec concentrator)
#         Squid listens here; device replies leave via eth0 -> tunnel.
#   eth1  egress ENI          (subnet default route -> NAT gateway)
#         created + attached at boot by the `proxy-net` OpenRC service, which
#         also writes /etc/squid/conf.d/egress.conf with:
#             tcp_outgoing_address <eth1-ip>
#         so every ORIGINATED connection is sourced from eth1 and, via a
#         source-based `ip rule`, egresses through the NAT gateway instead of
#         being sent back into the concentrator.
#
# Authorization is delegated to the `squid-infoproxy` external_acl helper, which
# keys Valkey on the CLIENT source IP (the real device global-identity IP, seen
# verbatim because there is no NLB and no SNAT in front of Squid).

# --- Listener ---------------------------------------------------------------
# Bind to all addresses on 8080; ipsecnode ECMP delivers tunnel-exit traffic to
# eth0. (Restricting to the eth0 IP is possible but the IP is only known post
# boot, so bind wildcard and let the SG + routing constrain reachability.)
http_port 8080

# --- Egress source binding (materialised at boot) ---------------------------
# proxy-net writes conf.d/egress.conf -> `tcp_outgoing_address <eth1-ip>`.
include /etc/squid/conf.d/*.conf

# --- Authorization + intranet/internet classification (one helper call) -----
# The helper authorizes against BOTH per-device allow-lists
# (infoproxy:intranet:<src> and infoproxy:internet:<src>) and returns a Squid
# `tag=` naming which namespace matched (intranet wins on overlap). The tag
# sticks to the transaction and is read back below during peer selection, so a
# single lookup yields both the authz verdict AND the routing decision. Squid
# feeds each request as `%SRC %DST %PORT %METHOD %>rd`.
external_acl_type infoproxy \
	ttl=60 negative_ttl=10 children-max=40 children-startup=4 \
	%SRC %DST %PORT %METHOD %>rd \
	/usr/local/bin/squid-infoproxy --proxy-type both --valkey-url @VALKEY_URL@

acl infoproxy_ok external infoproxy

# Matches the tag the helper stamped on intranet-authorized requests. Set during
# http_access evaluation (above); still present at peer-selection time (below).
acl is_intranet tag intranet

# --- Intranet vs internet split (driven by the helper tag) ------------------
# Intranet-tagged requests go to the single dumb downstream proxy that only
# knows how to reach the intranet; everything authorized-and-not-intranet is
# fetched directly via eth1 -> NAT -> internet. @INTRANET_PROXY@ / @INTRANET_PORT@
# are baked in / overridden by proxy-net from /etc/conf.d.
cache_peer @INTRANET_PROXY@ parent @INTRANET_PORT@ 0 no-query default name=intranet
cache_peer_access intranet allow is_intranet
cache_peer_access intranet deny all

# Force the routing decision: intranet -> peer only; everything else -> direct.
never_direct  allow  is_intranet
always_direct allow !is_intranet

# --- Health probe (ipsecscale liveness) -------------------------------------
# ipsecscale on the LVS nodes liveness-probes :8080 by issuing a proxy request
# for this sentinel host (RFC 2606 .invalid, never resolvable). Deny it FIRST --
# before the infoproxy helper runs -- so the probe gets an instant 403 (proof
# Squid is serving) with no Valkey lookup, and exclude it from access_log below
# so the 15s probes do not flood the log.
acl healthprobe dstdomain health.fleetproxy.invalid
http_access deny healthprobe

# --- Baseline safety ACLs ---------------------------------------------------
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 1025-65535
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# --- Access decision --------------------------------------------------------
http_access allow infoproxy_ok
http_access deny all

# --- Stateless forward proxy ------------------------------------------------
cache deny all
cache_dir null /tmp
via off
forwarded_for delete
httpd_suppress_version_string on

# Logs to stdout/stderr -> CloudWatch agent tails these (see amazon-cloudwatch).
# !healthprobe: drop the LVS liveness probes (denied above) from the access log.
access_log stdio:/var/log/squid/access.log !healthprobe
cache_log  stdio:/var/log/squid/cache.log
dns_v4_first on
coredump_dir /var/cache/squid
