#
# charon.conf -- performance tuning for fleetnode VPN concentrator nodes
# Applied as part of strongswan.d/*.conf include in strongswan.conf.

charon {
	# Thread pool for IKE processing.
	# c6in.4xlarge has 16 vCPU; 32 threads gives 2 per core with headroom
	# for IKE_SA_INIT bursts from rekeying and reconnecting customers.
	threads = 32

	# IKE SA hash table size -- must be a power of 2.
	# 32768 is the next power above the 25,000-tunnel target.
	ikesa_table_size = 32768

	# Hard cap on concurrent IKE SAs: 10% above target.
	ikesa_limit = 27500

	# Retransmission: 5 attempts with 4s initial timeout and 1.8x backoff.
	# Last attempt fires at ~4 + 7.2 + 13 + 23.4 + 42 = ~90s; matches
	# StrongSwan default but made explicit for visibility.
	retransmit_tries   = 5
	retransmit_timeout = 4.0
	retransmit_base    = 1.8

	# Journal logging (captured by systemd-journald).
	# All charon output goes to stdout -> journald via the systemd unit.
	# Set default level 1 (errors+warnings); auth level 2 (informational)
	# so each tunnel up/down event is logged.
	syslog {
		identifier = charon
		daemon {
			default = 1
		}
		auth {
			default = 2
			ike = 2
		}
	}
}
