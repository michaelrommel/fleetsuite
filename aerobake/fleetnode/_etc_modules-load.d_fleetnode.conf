# Kernel modules loaded at boot for fleetnode IPSec VPN concentrator nodes.

# ESP conntrack helper.
# Tracks proto 50 (raw ESP) sessions by SPI so conntrack correctly ages ESP
# flows on their own timeout rather than the generic unknown-protocol timeout.
nf_conntrack_proto_esp

# FTP conntrack + NAT helpers.
# Required for passive FTP data connections that arrive after a DNAT'd
# control session (port 21 -> aeroftp VIP).  nf_conntrack_ftp inspects the
# cleartext PASV response and creates a RELATED conntrack entry for the
# subsequent data connection so it is DNAT'd correctly without an explicit
# port rule.  nf_nat_ftp rewrites the IP address embedded in PORT/PASV
# payloads to match the translated address seen by the client.
nf_conntrack_ftp
nf_nat_ftp
