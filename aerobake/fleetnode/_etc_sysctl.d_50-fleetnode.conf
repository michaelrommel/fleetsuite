# sysctl tuning for fleetnode IPSec VPN concentrator nodes (Debian 12 Bookworm)
# Applied at boot via: sysctl -p /etc/sysctl.d/50-fleetnode.conf

# -- Hugepages for VPP packet buffer pool (Build Order step 5) ----------------
# 1024 x 2 MB = 2 GB; appropriate for c6in.xlarge (8 GB RAM).
# For prod (c6in.4xlarge, 32 GB RAM) raise to 4096 before enabling VPP.
# systemd-sysctl.service applies this before vpp.service starts.
vm.nr_hugepages = 1024

# -- IP forwarding -------------------------------------------------------------
# Required: VPP forwards decapsulated inner traffic between the tunnel VRFs
# and the uplink interface.
net.ipv4.ip_forward = 1

# Reverse-path filter: disabled.
# VPP performs 1:1 NAT using globally-routable mapped IPs that are not
# assigned to any Linux interface.  Strict (1) or loose (2) rp_filter would
# drop return traffic whose destination does not match a local route.
# The security boundary is enforced by the AWS SGs and the LVS nftables rules,
# not by rp_filter on the concentrator nodes.
net.ipv4.conf.all.rp_filter  = 0
# default.rp_filter=0 so every interface (the primary is ens5 on Debian, NOT
# eth0) inherits 0 under the kernel's MAX(all, interface) rp_filter semantics.
# A per-`eth0` key would silently not apply here (the NIC is ens5).
net.ipv4.conf.default.rp_filter = 0

# -- ESP / IKE conntrack -------------------------------------------------------
# nf_conntrack_proto_esp is loaded via /etc/modules-load.d/fleetnode.conf.
# Tracks ESP sessions by SPI; required for correct conntrack behaviour when
# both IKE (UDP) and ESP (proto 50) flows are processed by the kernel path.

net.netfilter.nf_conntrack_max                = 500000
net.netfilter.nf_conntrack_udp_timeout        = 300
net.netfilter.nf_conntrack_udp_timeout_stream = 600

# -- Socket buffers for high-PPS UDP -------------------------------------------
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728

# -- Martian logging -----------------------------------------------------------
# Log unexpected source addresses; a martian here likely indicates a stale
# conntrack entry or a misconfigured return route.
# NOTE: the primary NIC on Debian is ens5 (not eth0); adjust if a given AMI
# variant renames it. log_martians must name an interface that exists at boot.
net.ipv4.conf.ens5.log_martians = 1
