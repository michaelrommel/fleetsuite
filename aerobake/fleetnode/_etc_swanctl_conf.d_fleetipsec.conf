#
# fleetipsec.conf -- StrongSwan connection definitions for fleetnode nodes
#
# Per-device connections are loaded at runtime by ipsecnode via VICI load-conn.
# There are NO catch-all connections in this file; any device not registered
# in Valkey (MemoryDB) will be unable to establish a tunnel.
#
# The only static entry is bypass-vpc. Management SSH to VPN nodes always
# arrives via the bastion (172.16.x.x), never directly from the office LAN,
# so no office bypass is needed here.
#
# See AGENTS.md Architecture Decision #12 for the full credential design.

connections {

	# Bypass: VPC-internal traffic never goes through a customer tunnel.
	# Covers bastion SSH, EC2 API calls, SSM, and VPC-internal health checks.
	bypass-vpc {
		local_addrs  = %any
		remote_addrs = %any

		children {
			bypass-vpc {
				local_ts     = 0.0.0.0/0
				remote_ts    = 172.16.0.0/16
				mode         = pass
				start_action = trap
			}
		}
	}
}
