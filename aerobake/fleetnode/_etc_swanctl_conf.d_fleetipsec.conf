#
# fleetipsec.conf -- StrongSwan connection definitions for fleetnode nodes
#
# Credential management: ipsecnode (Increment 6a+6b)
#   - At startup ipsecnode bulk-loads all PSKs from Valkey (MemoryDB) into
#     charon via VICI load-shared commands -- no secrets file is written to
#     disk and swanctl --load-creds is never called.
#   - Runtime changes (new device / removed device) are handled incrementally
#     via Valkey keyspace notifications triggering VICI load-shared /
#     unload-shared -- non-disruptive to existing tunnels.
#   - This file (connection defs) is static and baked into the AMI.
#   - Secrets are NEVER stored on disk.
#
# Traffic selectors:
#   Both connections use 0.0.0.0/0 on both sides so StrongSwan accepts any
#   proposal from any customer device.  In practice each device proposes its
#   own internal subnet as local_ts; StrongSwan narrows to the intersection.
#
# install_policy / bypass strategy:
#   StrongSwan 5.9.8 swanctl.conf does not support install_policy (that is
#   ipsec.conf / stroke syntax).  Kernel xfrm policy installation is
#   therefore the default (yes) for the catch-all tunnel children.
#
#   Two explicit bypass (pass-mode) connections protect management access
#   regardless of what traffic selectors a test peer proposes:
#     bypass-vpc    -- 172.16.0.0/16  (VPC-internal SSH, EC2 API, SSM)
#     bypass-office -- 192.168.13.0/24 (office network -- koi, workstation)
#
#   For VPP integration (Build Order step 5), suppressing xfrm policy
#   installation will be revisited once the full StrongSwan/VPP interop
#   requirements are known.  The bypass connections remain in place either
#   way; they are harmless when VPP owns the data plane.

connections {

	# IKEv2 catch-all
	fleetipsec-ikev2 {
		version      = 2
		local_addrs  = %any
		remote_addrs = %any
		proposals    = aes256-sha256-modp2048, aes256-sha1-modp2048, aes128-sha256-modp2048
		dpd_delay    = 30s

		local {
			auth = psk
		}
		remote {
			auth = psk
			id   = %any
		}

		children {
			fleetipsec-ikev2 {
				local_ts      = 0.0.0.0/0
				remote_ts     = 0.0.0.0/0
				mode          = tunnel
				esp_proposals = aes256gcm16, aes256-sha256, aes128gcm16, aes128-sha256
				life_time     = 3600s
				rekey_time    = 3000s
				dpd_action    = restart
			}
		}
	}

	# IKEv1 catch-all -- legacy devices (IKEv1-only, behind CGNAT)
	fleetipsec-ikev1 {
		version      = 1
		local_addrs  = %any
		remote_addrs = %any
		encap        = yes
		proposals    = aes256-sha256-modp2048, aes256-sha1-modp2048, aes128-sha256-modp2048
		dpd_delay    = 30s

		local {
			auth = psk
		}
		remote {
			auth = psk
			id   = %any
		}

		children {
			fleetipsec-ikev1 {
				local_ts      = 0.0.0.0/0
				remote_ts     = 0.0.0.0/0
				mode          = tunnel
				esp_proposals = aes256gcm16, aes256-sha256, aes128gcm16, aes128-sha256
				life_time     = 3600s
				rekey_time    = 3000s
				dpd_action    = restart
			}
		}
	}

	# Bypass: VPC-internal traffic never goes through a customer tunnel.
	# Protects SSH from the management subnet and all EC2/SSM API calls.
	bypass-vpc {
		local_addrs  = %any
		remote_addrs = %any

		children {
			bypass-vpc {
				local_ts     = 172.16.0.0/16
				remote_ts    = 172.16.0.0/16
				mode         = pass
				start_action = trap
			}
		}
	}

	# Bypass: office network -- protects koi (.151) and workstation (.185)
	# SSH reply paths when a test tunnel with broad traffic selectors is active.
	# 192.168.13.133/32 (the test Linux host) is intentionally NOT covered here;
	# a tunnel child SA negotiated with remote_ts=192.168.13.133/32 installs a
	# /32 kernel policy which is more specific than this /24 and takes priority.
	bypass-office {
		local_addrs  = %any
		remote_addrs = %any

		children {
			bypass-office {
				local_ts     = 0.0.0.0/0
				remote_ts    = 192.168.13.0/24
				mode         = pass
				start_action = trap
			}
		}
	}
}
