#
# fleetipsec.conf -- StrongSwan connection definitions for fleetnode nodes
#
# Per-device connections are loaded at runtime by ipsecnode via VICI load-conn.
# There are NO catch-all connections in this file; any device not registered
# in Valkey (MemoryDB) will be unable to establish a tunnel.
#
# Management bypass connections are the only static entries here:
#   bypass-vpc    -- prevents VPC-internal traffic (SSH, EC2 API, SSM) from
#                    being caught by any customer xfrm policy
#   bypass-office -- protects koi (.151) and workstation (.185) SSH reply paths
#
# See AGENTS.md Architecture Decision #12 for the full credential design.

connections {

	# Bypass: VPC-internal traffic never goes through a customer tunnel.
	bypass-vpc {
		local_addrs  = %any
		remote_addrs = %any

		children {
			bypass-vpc {
				local_ts     = 172.16.0.0/16
				remote_ts    = 172.16.0.0/16
				mode         = pass
				start_action = trap
			}
		}
	}

	# Bypass: office network -- protects koi (.151) and workstation (.185).
	bypass-office {
		local_addrs  = %any
		remote_addrs = %any

		children {
			bypass-office {
				local_ts     = 0.0.0.0/0
				remote_ts    = 192.168.13.0/24
				mode         = pass
				start_action = trap
			}
		}
	}
}
