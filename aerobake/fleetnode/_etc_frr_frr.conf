! /etc/frr/frr.conf -- fleetnode VPN concentrator (Debian 12 Bookworm)
!
! Minimal placeholder.  Full BGP neighbour and redistribution config is
! added in Build Order step 4 (FRR BGP base config).
!
! ipsecnode (Increment 6c) manages /32 host route advertisement at runtime
! by issuing vtysh commands on CHILD_SA up/down events -- it does not
! rewrite this file.
!
frr version 10
frr defaults traditional
hostname fleetnode
log syslog informational
no ipv6 forwarding
!
line vty
!
