! /etc/frr/frr.conf -- fleetnode VPN concentrator (Debian 12 Bookworm)
! Build Order step 4: BGP base config.
!
! ASN assignments (fixed for the entire fleet):
!   AS 65001  VPN concentrators  (all nodes share one ASN; eBGP toward Return GW)
!   AS 65002  Return GW pair     (both nodes share one ASN)
!
! Return GW fixed eth0 IPs (chosen here; baked into fleetroute in Build Order step 7):
!   ReturnGW-master  172.16.51.4   (first usable in ReturnGW-a 172.16.51.0/27)
!   ReturnGW-backup  172.16.51.36  (first usable in ReturnGW-b 172.16.51.32/27)
!   AWS reserves .0 (network), .1 (VPC router), .2 (DNS), .3 (future), .31/.63 (broadcast).
!
! Route management at runtime (ipsecnode Increment 6c):
!   CHILD_SA up:   ip route add <mapped_global_ip>/32 blackhole
!   CHILD_SA down: ip route del <mapped_global_ip>/32 blackhole
!   FRR picks up the kernel static route and redistributes it via the
!   EXPORT-CUSTOMER route-map, which enforces the /32-only constraint.
!   ipsecnode does NOT rewrite this file.
!
! FRR is DISABLED in the AMI (systemctl disable frr).
! Enable when Return GW (Build Order step 7) is ready for T3 testing.
!
frr version 10
frr defaults traditional
hostname fleetnode
log syslog informational
no ipv6 forwarding
!
! Prefix filter: only /32 customer host routes may leave this node.
! Prevents any VPC subnet, connected route, or aggregate from leaking
! into the Return GW routing table.
!
ip prefix-list CUSTOMER-HOST-ROUTES seq 5 permit 0.0.0.0/0 ge 32 le 32
!
! Increment 6g phase 2 -- on-demand tunnel bring-up (P1 attraction).
! Covering aggregate(s) for the customer global_ip space.  Customer global_ips
! are scattered across almost the whole IPv4 space (legacy allocation), so
! rather than enumerate them we advertise the COMPLEMENT of our own protected
! networks: everything EXCEPT 172.16.0.0/16 (this VPC), 10.183.0.0/16 (future
! AWS base) and 169.254.0.0/16 (link-local: IMDS + Amazon Time Sync).  That
! collapses to the 39 fixed prefixes below (seq 10..200).
!
! Advertised from EVERY concentrator so the Return GW ECMPs a backend packet
! destined for a DOWN-tunnel global_ip to some concentrator (which then punts
! it to ipsecnode via NFQUEUE to trigger the on-demand initiate).  For an UP
! tunnel the more-specific /32 (dev vpp-outer) wins, so the aggregate only ever
! catches un-provisioned destinations.
!
! IMPORTANT: these are originated via `network` with `no bgp network import-check`
! (see router bgp) so NO covering Null0 is installed in THIS node's own FIB --
! the concentrator's own outbound internet is therefore never blackholed by the
! broad blocks.  The Return GW DOES install the received blocks in its main
! table (they forward backend->device transit) but keeps its OWN egress off
! them via policy routing (self traffic, iif lo -> clean table 250 -> NAT GW).
!
! To narrow later: replace the complement with the reduced set of real customer
! global_ip ranges (est. 50-100 CIDRs) -- one CUSTOMER-AGGREGATES permit + one
! `network` line each.  198.51.100.0/24 (seq 5) is the dev/test range kept
! explicit so the Return GW can accept JUST it during staged testing.
!
ip prefix-list CUSTOMER-AGGREGATES seq 5 permit 198.51.100.0/24
ip prefix-list CUSTOMER-AGGREGATES seq 10 permit 0.0.0.0/5
ip prefix-list CUSTOMER-AGGREGATES seq 15 permit 8.0.0.0/7
ip prefix-list CUSTOMER-AGGREGATES seq 20 permit 10.0.0.0/9
ip prefix-list CUSTOMER-AGGREGATES seq 25 permit 10.128.0.0/11
ip prefix-list CUSTOMER-AGGREGATES seq 30 permit 10.160.0.0/12
ip prefix-list CUSTOMER-AGGREGATES seq 35 permit 10.176.0.0/14
ip prefix-list CUSTOMER-AGGREGATES seq 40 permit 10.180.0.0/15
ip prefix-list CUSTOMER-AGGREGATES seq 45 permit 10.182.0.0/16
ip prefix-list CUSTOMER-AGGREGATES seq 50 permit 10.184.0.0/13
ip prefix-list CUSTOMER-AGGREGATES seq 55 permit 10.192.0.0/10
ip prefix-list CUSTOMER-AGGREGATES seq 60 permit 11.0.0.0/8
ip prefix-list CUSTOMER-AGGREGATES seq 65 permit 12.0.0.0/6
ip prefix-list CUSTOMER-AGGREGATES seq 70 permit 16.0.0.0/4
ip prefix-list CUSTOMER-AGGREGATES seq 75 permit 32.0.0.0/3
ip prefix-list CUSTOMER-AGGREGATES seq 80 permit 64.0.0.0/2
ip prefix-list CUSTOMER-AGGREGATES seq 85 permit 128.0.0.0/3
ip prefix-list CUSTOMER-AGGREGATES seq 90 permit 160.0.0.0/5
ip prefix-list CUSTOMER-AGGREGATES seq 95 permit 168.0.0.0/8
ip prefix-list CUSTOMER-AGGREGATES seq 100 permit 169.0.0.0/9
ip prefix-list CUSTOMER-AGGREGATES seq 105 permit 169.128.0.0/10
ip prefix-list CUSTOMER-AGGREGATES seq 110 permit 169.192.0.0/11
ip prefix-list CUSTOMER-AGGREGATES seq 115 permit 169.224.0.0/12
ip prefix-list CUSTOMER-AGGREGATES seq 120 permit 169.240.0.0/13
ip prefix-list CUSTOMER-AGGREGATES seq 125 permit 169.248.0.0/14
ip prefix-list CUSTOMER-AGGREGATES seq 130 permit 169.252.0.0/15
ip prefix-list CUSTOMER-AGGREGATES seq 135 permit 169.255.0.0/16
ip prefix-list CUSTOMER-AGGREGATES seq 140 permit 170.0.0.0/7
ip prefix-list CUSTOMER-AGGREGATES seq 145 permit 172.0.0.0/12
ip prefix-list CUSTOMER-AGGREGATES seq 150 permit 172.17.0.0/16
ip prefix-list CUSTOMER-AGGREGATES seq 155 permit 172.18.0.0/15
ip prefix-list CUSTOMER-AGGREGATES seq 160 permit 172.20.0.0/14
ip prefix-list CUSTOMER-AGGREGATES seq 165 permit 172.24.0.0/13
ip prefix-list CUSTOMER-AGGREGATES seq 170 permit 172.32.0.0/11
ip prefix-list CUSTOMER-AGGREGATES seq 175 permit 172.64.0.0/10
ip prefix-list CUSTOMER-AGGREGATES seq 180 permit 172.128.0.0/9
ip prefix-list CUSTOMER-AGGREGATES seq 185 permit 173.0.0.0/8
ip prefix-list CUSTOMER-AGGREGATES seq 190 permit 174.0.0.0/7
ip prefix-list CUSTOMER-AGGREGATES seq 195 permit 176.0.0.0/4
ip prefix-list CUSTOMER-AGGREGATES seq 200 permit 192.0.0.0/2
!
! EXPORT-CUSTOMER: applied at redistribution AND at neighbor outbound.
! Belt-and-suspenders -- double-filtering is harmless.
!   permit 10  -- the /32 customer host routes (kernel routes from ipsecnode)
!   permit 20  -- the covering aggregate(s) originated by `network` below
!
route-map EXPORT-CUSTOMER permit 10
	match ip address prefix-list CUSTOMER-HOST-ROUTES
route-map EXPORT-CUSTOMER permit 20
	match ip address prefix-list CUSTOMER-AGGREGATES
!
! REJECT-ALL: VPN nodes do not learn routes from Return GW.
! All inner-traffic forwarding is in VPP userspace, not the kernel RIB.
!
route-map REJECT-ALL deny 10
!
router bgp 65001
	bgp log-neighbor-changes
	!
	! Phase 2 (P1 attraction): originate the covering aggregate(s) UNCONDITIONALLY.
	! import-check would require a matching RIB route to originate a `network`;
	! disabling it lets us advertise the aggregates WITHOUT installing any covering
	! Null0 in this node's own FIB -- so the concentrator's own outbound internet
	! (EC2 API, package repos) is never blackholed by the broad blocks.
	no bgp network import-check
	!
	! ReturnGW-master  172.16.51.4  (ReturnGW-a eth0; subnet 172.16.51.0/27)
	neighbor 172.16.51.4 remote-as 65002
	neighbor 172.16.51.4 description ReturnGW-master
	neighbor 172.16.51.4 timers 10 30
	neighbor 172.16.51.4 timers connect 10
	! ReturnGW-a is in a different subnet from the VPN concentrators.
	! disable-connected-check allows FRR to initiate eBGP sessions to
	! non-directly-connected peers (VPC routing handles the path).
	neighbor 172.16.51.4 disable-connected-check
	!
	! ReturnGW-backup  172.16.51.36  (ReturnGW-b eth2; subnet 172.16.51.32/27)
	neighbor 172.16.51.36 remote-as 65002
	neighbor 172.16.51.36 description ReturnGW-backup
	neighbor 172.16.51.36 timers 10 30
	neighbor 172.16.51.36 timers connect 10
	! same reason as above
	neighbor 172.16.51.36 disable-connected-check
	!
	address-family ipv4 unicast
		!
		! Redistribute kernel blackhole /32 static routes added by ipsecnode.
		! EXPORT-CUSTOMER ensures only /32 customer host routes enter BGP table.
		!
		! ipsecnode installs /32 routes via `ip route` which the kernel
		! stores as protocol=static but FRR classifies as 'kernel' routes
		! (routes not installed by FRR itself). Use redistribute kernel.
		redistribute kernel route-map EXPORT-CUSTOMER
		!
		! Phase 2 aggregate(s): originate the covering prefix from every node.
		! Filtered outbound by EXPORT-CUSTOMER permit 20 (CUSTOMER-AGGREGATES).
		! Add one `network` line per production range alongside its Null0 route.
		!
		network 198.51.100.0/24
		network 0.0.0.0/5
		network 8.0.0.0/7
		network 10.0.0.0/9
		network 10.128.0.0/11
		network 10.160.0.0/12
		network 10.176.0.0/14
		network 10.180.0.0/15
		network 10.182.0.0/16
		network 10.184.0.0/13
		network 10.192.0.0/10
		network 11.0.0.0/8
		network 12.0.0.0/6
		network 16.0.0.0/4
		network 32.0.0.0/3
		network 64.0.0.0/2
		network 128.0.0.0/3
		network 160.0.0.0/5
		network 168.0.0.0/8
		network 169.0.0.0/9
		network 169.128.0.0/10
		network 169.192.0.0/11
		network 169.224.0.0/12
		network 169.240.0.0/13
		network 169.248.0.0/14
		network 169.252.0.0/15
		network 169.255.0.0/16
		network 170.0.0.0/7
		network 172.0.0.0/12
		network 172.17.0.0/16
		network 172.18.0.0/15
		network 172.20.0.0/14
		network 172.24.0.0/13
		network 172.32.0.0/11
		network 172.64.0.0/10
		network 172.128.0.0/9
		network 173.0.0.0/8
		network 174.0.0.0/7
		network 176.0.0.0/4
		network 192.0.0.0/2
		!
		neighbor 172.16.51.4 activate
		neighbor 172.16.51.4 route-map EXPORT-CUSTOMER out
		neighbor 172.16.51.4 route-map REJECT-ALL in
		!
		neighbor 172.16.51.36 activate
		neighbor 172.16.51.36 route-map EXPORT-CUSTOMER out
		neighbor 172.16.51.36 route-map REJECT-ALL in
		!
	exit-address-family
!
line vty
!
