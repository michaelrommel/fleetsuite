# /etc/ipsecnode/ipsecnode.toml
#
# Global backend server configuration for ipsecnode.
#
# real_ip   -- the actual AWS IP of each server (same for all customers).
# split     -- port-based DNAT rules applied after per-customer VPP SNAT,
#              on the vpp-outer interface.  Top-down; first match wins.
#
# The customer_view_ip for each role (the IP the customer's devices use to
# reach that server) is stored per-customer in Valkey:
#   fleetipsec:nat:<peer_ip>  ->  backend_nat.access_server / .sd_server / .em_server
#
# Example Valkey record (all three roles):
#   {
#     "device_nat": [...],
#     "backend_nat": {
#       "access_server": "194.138.39.18",
#       "sd_server":     "194.138.39.21",
#       "em_server":     "194.138.39.19"
#     }
#   }

# -- Remote-access / connection-management server -----------------------------
#
# Receives all traffic not explicitly split below.
# Port 8080 (HTTP proxy) is ECMP-load-balanced across the dynamic fleetproxy
# pool (members published by ipsecscale to Valkey key fleetipsec:proxy:pool;
# applied locally by ipsecnode's proxy-pool consumer as proxies scale in/out).
# Ports 21 and 22 (FTP control + SFTP) plus the passive-FTP data-port range
# 20000-49999 are redirected to the aeroftp VIP (fixed). Passive data ports
# come from aeroftp's net.ipv4.ip_local_reserved_ports = 20000-49999.
[backend.access_server]
real_ip = "172.16.53.6"

[[backend.access_server.split]]
ports = [8080]
pool  = "proxy"             # dynamic ECMP pool (fleetipsec:proxy:pool)

[[backend.access_server.split]]
ports   = [21, 22]
dnat_to = "172.16.48.10"    # aeroftp LVS VIP (active AZ)

[[backend.access_server.split]]
port_from = 20000           # passive-FTP data-port range -> the aeroftp VIP
port_to   = 49999
dnat_to   = "172.16.48.10"

# Uncomment if non-RFC-conformant FTP clients use source port 20 for passive
# data connections (see Open TODOs in AGENTS.md):
# [[backend.access_server.split]]
# src_ports = [20]
# dnat_to   = "172.16.48.10"

# -- Software-distribution server ---------------------------------------------
[backend.sd_server]
real_ip = "172.16.53.8"

# -- Event-management server --------------------------------------------------
[backend.em_server]
real_ip = "172.16.53.9"
