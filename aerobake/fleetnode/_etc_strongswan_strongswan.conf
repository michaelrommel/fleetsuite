#
# strongswan.conf -- fleetnode IPSec VPN concentrator nodes (Debian 12 Bookworm)
#
# charon-systemd plugin loading: modular, driven by strongswan.d/charon/*.conf.
# charon daemon tuning (threads, SA table sizes) is in strongswan.d/charon.conf.
#
# swanctl plugin suppressions: the swanctl client binary loads its own plugin
# set on every invocation.  The plugins below are not shipped in the Debian
# strongswan packages; suppressing them here eliminates startup warnings.

charon-systemd {
	load_modular = yes

	plugins {
		include strongswan.d/charon/*.conf
	}
}

include strongswan.d/*.conf

swanctl {
	plugins {
		test-vectors {
			load = no
		}
		ldap {
			load = no
		}
		pkcs11 {
			load = no
		}
		rdrand {
			load = no
		}
		gcrypt {
			load = no
		}
		agent {
			load = no
		}
		af-alg {
			load = no
		}
		curve25519 {
			load = no
		}
		chapoly {
			load = no
		}
		cmac {
			load = no
		}
		ctr {
			load = no
		}
		ccm {
			load = no
		}
		ntru {
			load = no
		}
		curl {
			load = no
		}
	}
}
