#
# /etc/vpp/startup.conf -- VPP startup configuration for fleetnode IPSec
# VPN concentrators (Debian 12 Bookworm).
# Build Order step 5.
#
# Role: inner-traffic forwarding with per-customer VRF isolation and
# 1:1 SNAT/DNAT.  StrongSwan (kernel xfrm) handles ESP encap/decap;
# VPP processes the decapsulated inner packets via af_packet interfaces
# created at runtime by ipsecnode (Increment 6d).
#
# Interface strategy: af_packet (kernel-mode driver).
# No DPDK PCI interface binding -- ENA is left with the kernel driver so
# eth0 remains available to StrongSwan, FRR, SSH, and ipsecnode.
# DPDK plugin is explicitly disabled to prevent it from probing PCI devices.
#
# Hugepages: 1024 x 2 MB pages (= 2 GB) reserved at boot by vm.nr_hugepages
# in /etc/sysctl.d/50-fleetnode.conf.  systemd-sysctl.service runs before
# vpp.service so pages are available before VPP starts.
#
# Instance sizing:
#   Dev  -- c6in.xlarge  ( 4 vCPUs,  8 GB RAM)
#   Prod -- c6in.4xlarge (16 vCPUs, 32 GB RAM)
#   For prod raise vm.nr_hugepages to 4096 and workers to 4-8 here.
#

unix {
	# nodaemon: stay in the foreground; systemd (Type=simple) tracks the
	# process directly.  Do NOT add the 'interactive' keyword -- VPP must
	# not read from stdin when started by systemd.
	nodaemon
	log             /var/log/vpp/vpp.log
	full-coredump
	cli-listen      /run/vpp/cli.sock
	gid             vpp
	# Startup CLI commands -- interfaces and NAT tables are configured at
	# runtime by ipsecnode via the binary API socket; setup.gate is empty.
	startup-config  /etc/vpp/setup.gate
}

api-trace {
	# Record all binary API calls in a circular trace buffer.
	# Invaluable for post-mortem debugging; negligible overhead.
	on
}

api-segment {
	gid vpp
}

# Binary API socket used by ipsecnode (Increment 6d) and vppctl.
# 'default' places it at /run/vpp/api.sock (created by RuntimeDirectory
# in the systemd unit; no manual mkdir needed).
socksvr {
	default
}

memory {
	# Main heap for VPP control-plane structures (route tables, NAT entries,
	# VRF state).  512 MB handles ~5000 concurrent tunnels with headroom.
	# Raise to 1-2 G for prod (c6in.4xlarge) if NAT table grows large.
	main-heap-size      512m
	# Allocate the main heap from 2 MB hugepages for TLB efficiency.
	main-heap-page-size 2m
}

buffers {
	# buffers-per-numa  65536    # raise from 16384 for c6in.4xlarge production
	# Packet buffer pool drawn from 2 MB hugepages.
	# 16384 buffers x 2048 B each = 32 MB, requiring 16 x 2 MB pages.
	# At 10 Gbps / 1 us switch latency ~1250 packets are in flight;
	# 16384 buffers gives 13x headroom against transient bursts.
	buffers-per-numa  16384
	default data-size 2048
	page-size         2m
}

cpu {
	# VPP default (no main-core): main thread placed on core 1.
	# No workers: the main thread handles both control-plane API calls
	# and the af_packet receive/transmit path for Increment 6d.
	# For prod (c6in.4xlarge) add:
	#   corelist-workers 2-5
	# to pin 4 worker threads on cores 2-5, leaving cores 0-1 for OS
	# and VPP main, and cores 6-15 for StrongSwan/FRR/ipsecnode.
}

plugins {
	# Disable only the DPDK plugin -- ENA PCI binding is not used.
	# All other installed plugins (af_packet, NAT, memif, punt, ...) are
	# enabled by VPP's default-enable policy.
	plugin dpdk_plugin.so { disable }
}
