# Kernel modules loaded at boot for fleetscale IPSec LVS nodes.

# ESP conntrack helper.
# Tracks proto 50 (raw ESP) sessions by SPI so that nftables DNAT + SNAT
# works correctly for ESP flows without requiring NAT-T (UDP 4500) fallback.
# Without this module, the kernel treats ESP as a generic L4 protocol and
# cannot distinguish individual tunnels — DNAT + SNAT still functions but
# conntrack entries age out on the generic timeout rather than the ESP timeout.
nf_conntrack_proto_esp
