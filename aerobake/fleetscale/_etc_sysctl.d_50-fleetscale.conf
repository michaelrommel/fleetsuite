# sysctl tuning for fleetscale IPSec LVS nodes (c6in.4xlarge, Alpine Linux)
# Applied at boot via: sysctl -p /etc/sysctl.d/50-fleetscale.conf

# ── IP forwarding ─────────────────────────────────────────────────────────────
# Required to forward ESP/IKE between eth0 (customer-facing) and the VPN
# concentrator subnets via the rtb-vpn default route.
net.ipv4.ip_forward = 1

# Strict reverse-path filtering on all interfaces.
# eth1 (management) sees only management-subnet traffic so no asymmetric
# routing concern exists there; no src_valid_mark tuning needed.
net.ipv4.conf.all.rp_filter = 1

# ── ESP / IKE conntrack ───────────────────────────────────────────────────────
# nf_conntrack_proto_esp is loaded via /etc/modules-load.d/fleetscale.conf.
# It tracks ESP sessions by SPI so that DNAT → SNAT round-trips work correctly
# for proto 50 (raw ESP) without requiring NAT-T encapsulation.

# Maximum number of tracked connections.
# At 25,000 tunnels each with IKE + ESP + potential rekeying: 500k gives 20×
# headroom, comfortably within c6in.4xlarge's 32 GiB RAM.
net.netfilter.nf_conntrack_max = 500000

# UDP conntrack timeouts.
# IKE keepalive (DPD) fires every 30 s; 300 s is 10× that — enough to survive
# a brief network blip without evicting the conntrack entry.
net.netfilter.nf_conntrack_udp_timeout        = 300
net.netfilter.nf_conntrack_udp_timeout_stream = 600

# ── High-PPS softirq throughput ───────────────────────────────────────────────
# c6in.4xlarge has 16 vCPUs; raise the NAPI budget so bursty IKE keepalive
# storms do not starve other queues.
net.core.netdev_budget       = 1200
net.core.netdev_budget_usecs = 8000

# ── Socket buffers for high-PPS UDP ───────────────────────────────────────────
# IKE and DPD traffic is UDP; allow large receive buffers so that a burst of
# keepalives from 25k tunnels does not overflow the socket receive queue.
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728

# ── Martian logging ───────────────────────────────────────────────────────────
# Log unexpected source addresses on both NICs; a martian usually indicates
# a misconfigured route or a stale conntrack entry after failover.
net.ipv4.conf.eth0.log_martians = 1
net.ipv4.conf.eth1.log_martians = 1
