# dnsmasq configuration for fleetscale IPSec LVS nodes
#
# Purpose: local caching DNS resolver to absorb transient VPC DNS outages.
# ipsecscale runs continuously and makes periodic EC2/AutoScaling API calls;
# a dropped DNS packet during a burst would cause an API failure and a
# missed pool-update cycle.  A local cache eliminates that failure mode.
#
# Identical in purpose to the aeroscale dnsmasq config.

# ── Upstream ──────────────────────────────────────────────────────────────────
# Hardcode the VPC resolver; dhcpcd is configured with nohook resolv.conf.
no-resolv
no-poll
server=169.254.169.253

# ── Cache ─────────────────────────────────────────────────────────────────────
# 1000 entries covers all AWS service endpoints used by ipsecpulse/ipsecscale.
cache-size=1000
