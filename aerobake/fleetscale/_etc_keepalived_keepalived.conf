# keepalived.conf — IPSec LVS nodes (fleetscale)
#
# This file is STATIC.  All dynamic content (VRRP peer addresses, priorities,
# notify script paths) is written by ipsecpulse at boot time into vrrp.conf.
#
# The included vrrp.conf is regenerated on every boot from IMDS instance tags:
#
#   ipsec-lb-role         → VRRP priority + nopreempt flag
#   ipsec-lb-peer-mgmt-ip → unicast_peer address (peer's eth1 fixed IP)
#
# Do NOT add virtual_server blocks here — there are no IPVS backends.
# The load balancing is done entirely by nftables DNAT (stateless jhash).

global_defs {
	router_id fleetscale
	enable_script_security
}

include /etc/keepalived/vrrp.conf
