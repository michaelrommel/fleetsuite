# sysctl tuning for fleetroute IPSec Return GW nodes (c6in.2xlarge, Alpine Linux)
# Applied at boot via: sysctl -p /etc/sysctl.d/50-fleetroute.conf

# -- IP forwarding -------------------------------------------------------------
net.ipv4.ip_forward = 1

# Reverse-path filter: loose mode.
# eth2 (BGP ENI) and eth0 are both in the same /27 subnet.  BGP packets
# from VPN concentrators arrive on eth2 but the main routing table's best
# route back to those IPs goes via eth0.  Strict mode (=1) would drop them.
# Loose mode (=2) only requires the source IP to be reachable via any interface.
net.ipv4.conf.all.rp_filter = 2

# -- ARP / neighbor table ------------------------------------------------------
# With up to 10 VPN concentrators and many backend servers, the default neighbor
# table limits (512/1024) are fine. Raise only if arp_cache_overflow appears.
# net.ipv4.neigh.default.gc_thresh3 = 4096

# -- Martian logging -----------------------------------------------------------
net.ipv4.conf.eth0.log_martians = 1
net.ipv4.conf.eth1.log_martians = 1
