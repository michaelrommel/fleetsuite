# sysctl tuning for fleetroute IPSec Return GW nodes (c6in.2xlarge, Alpine Linux)
# Applied at boot via: sysctl -p /etc/sysctl.d/50-fleetroute.conf

# -- IP forwarding -------------------------------------------------------------
net.ipv4.ip_forward = 1

# Reverse-path filter: disabled (0).
# rp_filter=2 (loose) is insufficient for the IPIP forwarding case:
# when inner packets (src in ReturnGW-a subnet) arrive on ipip-gw and need
# to be forwarded to eth3 (VPN-b subnet), loose rp_filter still rejects them
# because no return path via ipip-gw is visible to the kernel.
# The Return GW is a dedicated router; rp_filter provides no security benefit
# here and is actively harmful for tunnel forwarding.
net.ipv4.conf.all.rp_filter = 0

# -- ARP / neighbor table ------------------------------------------------------
# With up to 10 VPN concentrators and many backend servers, the default neighbor
# table limits (512/1024) are fine. Raise only if arp_cache_overflow appears.
# net.ipv4.neigh.default.gc_thresh3 = 4096

# -- Martian logging -----------------------------------------------------------
net.ipv4.conf.eth0.log_martians = 1
net.ipv4.conf.eth1.log_martians = 1
