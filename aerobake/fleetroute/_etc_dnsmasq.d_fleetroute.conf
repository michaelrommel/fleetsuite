# dnsmasq configuration for fleetroute IPSec Return GW nodes
#
# Purpose: local caching DNS resolver to absorb transient VPC DNS outages.
# fleetpulse runs at boot and keepalived notify scripts call back into
# fleetpulse; both make EC2 API calls over HTTPS. A local cache eliminates
# DNS failure as a transient boot/failover failure mode.

# -- Upstream ------------------------------------------------------------------
# Hardcode the VPC resolver; dhcpcd is configured with nohook resolv.conf.
no-resolv
no-poll
server=169.254.169.253

# -- Cache ---------------------------------------------------------------------
# 1000 entries covers all AWS service endpoints used by fleetpulse.
cache-size=1000
