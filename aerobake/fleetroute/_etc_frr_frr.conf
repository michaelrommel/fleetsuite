! /etc/frr/frr.conf -- fleetroute Return GW (Alpine)
! Build Order step 7: BGP base config for Return GW pair.
!
! ASN assignments (fixed for the entire fleet):
!   AS 65001  VPN concentrators  (all nodes share one ASN; eBGP toward Return GW)
!   AS 65002  Return GW pair     (both nodes share one ASN)
!
! This node (AS 65002) accepts BGP sessions from any VPN concentrator in the
! two VPN concentrator subnets via bgp listen range.  No VPN concentrator IP
! is pre-configured -- the ASG manages the pool dynamically and each VPN node
! initiates its own BGP session to this node's fixed eth0 IP.
!
! /32 customer host routes received from VPN nodes are installed into the kernel
! routing table by zebra and forwarded to route backend server replies back to
! the correct VPN concentrator.
!
! Both master and backup Return GW nodes maintain BGP sessions with all VPN
! nodes simultaneously.  Failover is via route table update only -- no BGP
! reconvergence needed after a VRRP master transition.
!
! The Return GW never advertises routes to VPN nodes (REJECT-ALL out).
! VPN node inner-traffic forwarding is handled by VPP userspace, not the
! kernel RIB, so no routes are needed from the Return GW.
!
frr version 10
frr defaults traditional
hostname fleetroute
log syslog informational
no ipv6 forwarding
!
! Only accept /32 customer host routes from VPN nodes.
! Prevents any VPC subnet, connected route, or aggregate from entering
! the Return GW routing table.
!
ip prefix-list CUSTOMER-HOST-ROUTES seq 5 permit 0.0.0.0/0 ge 32 le 32
!
! Increment 6g phase 2: also accept the covering aggregate(s) the
! concentrators originate for on-demand tunnel bring-up (P1 attraction).
! Installed as an ECMP route across the concentrator pool (see maximum-paths),
! so a backend packet to a DOWN-tunnel global_ip reaches some concentrator.
! Keep this list in sync with CUSTOMER-AGGREGATES in the fleetnode frr.conf.
!
ip prefix-list CUSTOMER-AGGREGATES seq 5 permit 198.51.100.0/24
ip prefix-list CUSTOMER-AGGREGATES seq 10 permit 0.0.0.0/5
ip prefix-list CUSTOMER-AGGREGATES seq 15 permit 8.0.0.0/7
ip prefix-list CUSTOMER-AGGREGATES seq 20 permit 10.0.0.0/9
ip prefix-list CUSTOMER-AGGREGATES seq 25 permit 10.128.0.0/11
ip prefix-list CUSTOMER-AGGREGATES seq 30 permit 10.160.0.0/12
ip prefix-list CUSTOMER-AGGREGATES seq 35 permit 10.176.0.0/14
ip prefix-list CUSTOMER-AGGREGATES seq 40 permit 10.180.0.0/15
ip prefix-list CUSTOMER-AGGREGATES seq 45 permit 10.182.0.0/16
ip prefix-list CUSTOMER-AGGREGATES seq 50 permit 10.184.0.0/13
ip prefix-list CUSTOMER-AGGREGATES seq 55 permit 10.192.0.0/10
ip prefix-list CUSTOMER-AGGREGATES seq 60 permit 11.0.0.0/8
ip prefix-list CUSTOMER-AGGREGATES seq 65 permit 12.0.0.0/6
ip prefix-list CUSTOMER-AGGREGATES seq 70 permit 16.0.0.0/4
ip prefix-list CUSTOMER-AGGREGATES seq 75 permit 32.0.0.0/3
ip prefix-list CUSTOMER-AGGREGATES seq 80 permit 64.0.0.0/2
ip prefix-list CUSTOMER-AGGREGATES seq 85 permit 128.0.0.0/3
ip prefix-list CUSTOMER-AGGREGATES seq 90 permit 160.0.0.0/5
ip prefix-list CUSTOMER-AGGREGATES seq 95 permit 168.0.0.0/8
ip prefix-list CUSTOMER-AGGREGATES seq 100 permit 169.0.0.0/9
ip prefix-list CUSTOMER-AGGREGATES seq 105 permit 169.128.0.0/10
ip prefix-list CUSTOMER-AGGREGATES seq 110 permit 169.192.0.0/11
ip prefix-list CUSTOMER-AGGREGATES seq 115 permit 169.224.0.0/12
ip prefix-list CUSTOMER-AGGREGATES seq 120 permit 169.240.0.0/13
ip prefix-list CUSTOMER-AGGREGATES seq 125 permit 169.248.0.0/14
ip prefix-list CUSTOMER-AGGREGATES seq 130 permit 169.252.0.0/15
ip prefix-list CUSTOMER-AGGREGATES seq 135 permit 169.255.0.0/16
ip prefix-list CUSTOMER-AGGREGATES seq 140 permit 170.0.0.0/7
ip prefix-list CUSTOMER-AGGREGATES seq 145 permit 172.0.0.0/12
ip prefix-list CUSTOMER-AGGREGATES seq 150 permit 172.17.0.0/16
ip prefix-list CUSTOMER-AGGREGATES seq 155 permit 172.18.0.0/15
ip prefix-list CUSTOMER-AGGREGATES seq 160 permit 172.20.0.0/14
ip prefix-list CUSTOMER-AGGREGATES seq 165 permit 172.24.0.0/13
ip prefix-list CUSTOMER-AGGREGATES seq 170 permit 172.32.0.0/11
ip prefix-list CUSTOMER-AGGREGATES seq 175 permit 172.64.0.0/10
ip prefix-list CUSTOMER-AGGREGATES seq 180 permit 172.128.0.0/9
ip prefix-list CUSTOMER-AGGREGATES seq 185 permit 173.0.0.0/8
ip prefix-list CUSTOMER-AGGREGATES seq 190 permit 174.0.0.0/7
ip prefix-list CUSTOMER-AGGREGATES seq 195 permit 176.0.0.0/4
ip prefix-list CUSTOMER-AGGREGATES seq 200 permit 192.0.0.0/2
!
! ACCEPT-CUSTOMER: applied at neighbor inbound.
!   permit 10  -- /32 customer host routes (one per UP tunnel, owner only)
!   permit 20  -- covering aggregate(s) (originated by every concentrator).
!                 These near-0/0 aggregates DO land in the main table and are
!                 what forwards backend->device transit (iif=eth0) to a
!                 concentrator.  This node's OWN egress is kept off them by
!                 policy routing in the keepalived init script (iif lo -> clean
!                 table 250 -> NAT GW), NOT by BGP.  (A zebra `set table` on the
!                 `ip protocol bgp` hook was tried first but this FRR build
!                 ignores it -- the routes stayed in main.)
!
route-map ACCEPT-CUSTOMER permit 10
	match ip address prefix-list CUSTOMER-HOST-ROUTES
route-map ACCEPT-CUSTOMER permit 20
	match ip address prefix-list CUSTOMER-AGGREGATES
!
! REJECT-ALL: Return GW advertises nothing to VPN nodes.
!
route-map REJECT-ALL deny 10
!
router bgp 65002
	bgp log-neighbor-changes
	!
	! The peer group must be declared before bgp listen range references it.
	! FRR parses config sequentially -- referencing an undefined peer group
	! causes the listen range lines to be silently dropped.
	!
	neighbor VPN-NODES peer-group
	neighbor VPN-NODES remote-as 65001
	neighbor VPN-NODES timers 10 30
	neighbor VPN-NODES timers connect 10
	! VPN concentrators are in 172.16.49/50.x; the Return GW eth2 is in
	! 172.16.51.x -- different subnets, not directly connected.
	! disable-connected-check prevents FRR's NHT from requiring a connected
	! route for next-hop resolution (same reason as on the VPN node side).
	neighbor VPN-NODES disable-connected-check
	!
	! Accept BGP sessions from any VPN concentrator in either VPN subnet.
	! Sessions are assigned to the VPN-NODES peer group.
	! The listen limit default (100) is well above the max ASG size (10).
	!
	bgp listen range 172.16.49.0/24 peer-group VPN-NODES
	bgp listen range 172.16.50.0/24 peer-group VPN-NODES
	!
	address-family ipv4 unicast
		!
		! ECMP the covering aggregate across all concentrators advertising it
		! (default eBGP maximum-paths is 1).  The /32 host routes are unique per
		! owner and unaffected; only the shared aggregate load-balances.
		! 16 >= max ASG size (10).
		!
		maximum-paths 16
		!
		neighbor VPN-NODES activate
		!
		! Accept /32 customer host routes only.
		neighbor VPN-NODES route-map ACCEPT-CUSTOMER in
		!
		! Advertise nothing to VPN nodes.
		neighbor VPN-NODES route-map REJECT-ALL out
		!
		no neighbor VPN-NODES send-community
		!
	exit-address-family
!
line vty
!
