# keepalived.conf -- IPSec Return GW nodes (fleetroute)
#
# This file is STATIC.  All dynamic content (VRRP peer addresses, priorities,
# notify script paths) is written by fleetpulse at boot time into vrrp.conf.
#
# The included vrrp.conf is regenerated on every boot from IMDS instance tags:
#
#   ipsec-gw-role          -> VRRP priority + nopreempt flag
#   ipsec-gw-peer-mgmt-ip  -> unicast_peer address (peer's eth1 fixed IP)
#
# Failover mechanism: no virtual_ipaddress is used.  On MASTER election the
# notify-master.sh script calls fleetpulse notify-master which upserts the
# 0.0.0.0/0 default route in the backend route table to point at this node's
# eth0 ENI.  This makes all backend server traffic flow through the master.

global_defs {
	router_id fleetroute
	enable_script_security
}

include /etc/keepalived/vrrp.conf
