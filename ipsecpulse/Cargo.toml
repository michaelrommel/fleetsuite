[package]
name        = "ipsecpulse"
version     = "0.1.0"
edition     = "2021"
publish     = false

[[bin]]
name = "ipsecpulse"
path = "src/main.rs"

[dependencies]
# Shared crates from the aerosuite submodule
aerocore         = { path = "../vendor/aerosuite/aerocore" }
ipseccore        = { path = "../ipseccore" }

anyhow           = { workspace = true }
clap             = { workspace = true }
chrono           = { workspace = true }
tokio            = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
